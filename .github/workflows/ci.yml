# Admin_CI_Workflow — runs the mandatory pre-deploy Quality_Gate for visibility
# on every push. The gate that actually blocks the Cloudflare Workers Builds
# deploy lives inside `npm run build`; this workflow reports the same result as
# a check run so a failure is visible before the deploy pipeline reaches it.
name: CI

on:
  # Every branch. The gate is not path-filtered: it covers lockfiles, types,
  # lint, suppressions, and the test suite, any of which a "docs-only" push can
  # break (README/AGENTS are gate-adjacent documentation).
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The check run reported for this job is named "CI / Quality gate"; its
    # conclusion is success only when `npm run gate` exits 0. No step below
    # uses continue-on-error, and the gate is the final step, so the job
    # conclusion mirrors the Quality_Gate exit code exactly.
    name: Quality gate
    # Laptop ARC scale set — the Main_Repository label for Node-only gates.
    # Must be the sole runs-on value: mixing it with self-hosted/lite/full
    # stops GitHub routing to the scale set.
    runs-on: docker-desktop
    timeout-minutes: 20
    steps:
      # Standing self-hosted runners keep the previous job's tree; clear it so
      # a stale node_modules or lockfile cannot influence the gate.
      - name: Clean Workspace
        shell: bash
        run: |
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          chmod -R u+w . || true
          rm -rf ./* || true
          rm -rf ./.git || true
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # No `cache: npm` — the persistent /opt/ci/npm volume already carries
          # the cache between jobs on this fleet, and setup-node's remote cache
          # caused post-job timeouts in Main_Repository.
          package-manager-cache: false
          node-version: 22
      # The /opt/ci npm volume rejects the atomic rename npm's _cacache needs
      # (ENOSYS); use the local default cache instead.
      - name: Use local npm cache
        shell: bash
        run: echo "NPM_CONFIG_CACHE=${HOME}/.npm" >> "$GITHUB_ENV"
      # Plain `npm ci` — the documented clean-checkout install. Do not add
      # --ignore-scripts: .npmrc sets ignore-scripts=false because esbuild,
      # workerd, @firebase/util, and protobufjs need their install-time builds,
      # and the gate's typecheck/lint/test members depend on those binaries.
      - name: Install dependencies
        run: npm ci
      # Final step: its exit code is the job's, and therefore the check run's.
      - name: Run Quality_Gate
        run: npm run gate
