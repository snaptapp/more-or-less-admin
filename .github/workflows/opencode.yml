# Interactive opencode agent: /oc and /opencode comment commands for fixes,
# follow-ups, targeted changes, and explicit reviews.
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Separate issue comments and review comments so a batch of line-level
  # review comments cannot cancel a pending `/oc` issue comment, and vice versa.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/opencode ') ||
        github.event.comment.body == '/opencode')
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/opencode ') ||
        github.event.comment.body == '/opencode')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Record job start time
        id: job_start
        shell: bash
        run: printf 'epoch=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Model probing, verified install, agent run with retry/salvage, and the
      # leaked-path comment guard are handled by the action. `use-github-token`
      # keeps the job's GITHUB_TOKEN (contents: write) as the push credential.
      # `job-started-at` anchors the 40-minute agent budget to job start so the
      # retry and the guard still run inside the 45-minute job limit.
      - name: Run opencode
        uses: tonythethompson/opencode-action@8b917d4ce4f10a967e9d29ae263d05580c3ed395 # v0.8.0
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action expects CLOUDFLARE_API_TOKEN; the org shares both names,
          # so fall back to the legacy CLOUDFLARE_API_KEY name just in case.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        with:
          use-github-token: 'true'
          job-started-at: ${{ steps.job_start.outputs.epoch }}
          timeout-minutes: '40'
          # Review runs lead with the Cloudflare GLM/DeepSeek/GPT-OSS chain and
          # fall back to free Zen models; fix runs lead with the flash chain.
          models-review: >-
            cf:@cf/zai-org/glm-5.3,
            cf:@cf/deepseek-ai/deepseek-v4-pro-0813,
            cf:@cf/openai/gpt-oss-120b,
            zen:big-pickle,
            zen:nemotron-3-ultra-free
          models-fix: >-
            cf:@cf/zai-org/glm-5.3-flash,
            cf:@cf/deepseek-ai/deepseek-v4-flash-0731,
            cf:@cf/openai/gpt-oss-120b,
            zen:nemotron-3.5-lightning-free,
            zen:big-pickle,
            zen:nemotron-3-ultra-free,
            zen:deepseek-v4-flash
