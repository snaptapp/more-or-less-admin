name: Shared artifact freshness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# This workflow is observation-only. It has read access to repository metadata
# and never creates a branch, commit, pull request, or release.
permissions:
  contents: read

concurrency:
  group: shared-artifact-freshness
  cancel-in-progress: true

jobs:
  freshness:
    name: Upstream shared artifact freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Admin repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check upstream artifact freshness
        env:
          GITHUB_TOKEN: ${{ secrets.SHARED_ARTIFACT_PAT || github.token }}
        run: npm run check:artifact-freshness
